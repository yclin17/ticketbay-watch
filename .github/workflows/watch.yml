name: ticketbay-watch

on:
  schedule:
    - cron: "40 * * * *"   # hourly (off the :00 mark, which GitHub often delays)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # to commit seen.json back

concurrency:
  group: ticketbay-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_QTY: "3"
          TOGETHER: "1"
        run: python3 watch.py

      - name: Save seen listings
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen listings"
            git push
          fi
